<!doctype html>
<html lang="en"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skywatch Weather</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page">
    <section class="panel">
        <h1>Skywatch Weather</h1>
        <p>This is a temporary Thymeleaf placeholder for the frontend team.</p>
        <p>Signed in as <strong sec:authentication="name">user@example.com</strong>.</p>

        <form method="post" th:action="@{/logout}">
            <button type="submit">Log out</button>
        </form>

        <form method="post" th:action="@{/locations}" class="location-form">
            <label>
                City
                <input name="city" required maxlength="120" placeholder="Lagos">
            </label>
            <label>
                Country code
                <input name="countryCode" minlength="2" maxlength="2" placeholder="NG">
            </label>
            <button type="submit">Save location</button>
        </form>

        <h2>Saved locations</h2>
        <ul>
            <li th:each="location : ${locations}">
                <span th:text="${location.city}">City</span>
                <span th:if="${location.countryCode}" th:text="'(' + ${location.countryCode} + ')'">(NG)</span>
            </li>
        </ul>
    </section>
</main>
</body>
</html>
