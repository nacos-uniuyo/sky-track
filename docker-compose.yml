services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skytrack
      POSTGRES_USER: skytrack_user
      POSTGRES_PASSWORD: skywatch99
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skytrack_user -d skytrack"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/skytrack
      DB_USERNAME: skytrack_user
      DB_PASSWORD: skywatch99
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

volumes:
  pgdata:

networks:
  app-net:
