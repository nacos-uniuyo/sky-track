<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Skywatch Weather</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page">
    <section class="panel auth-panel">
        <h1>Login</h1>
        <p th:if="${param.registered}" class="success">Account created. You can log in now.</p>
        <p th:if="${param.error}" class="error">Invalid email or password.</p>
        <p th:if="${param.logout}" class="success">You have been logged out.</p>

        <form method="post" th:action="@{/login}" class="location-form">
            <label>
                Email
                <input type="email" name="email" required autocomplete="email">
            </label>
            <label>
                Password
                <input type="password" name="password" required autocomplete="current-password">
            </label>
            <button type="submit">Log in</button>
        </form>

        <p>Need an account? <a th:href="@{/signup}">Sign up</a></p>
    </section>
</main>
</body>
</html>
