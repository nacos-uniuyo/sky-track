<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | SkyTrack App</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page">
    <section class="panel auth-panel">
        <h1>Create account</h1>

        <form method="post" th:action="@{/signup}" th:object="${signupRequest}" class="location-form">
            <label>
                Full name
                <input th:field="*{fullName}" required maxlength="120" autocomplete="name">
                <span class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
            </label>
            <label>
                Email
                <input type="email" th:field="*{email}" required maxlength="180" autocomplete="email">
                <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </label>
            <label>
                Password
                <input type="password" th:field="*{password}" required minlength="8" maxlength="72" autocomplete="new-password">
                <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </label>
            <button type="submit">Create account</button>
        </form>

        <p>Already have an account? <a th:href="@{/login}">Log in</a></p>
    </section>
</main>
</body>
</html>
